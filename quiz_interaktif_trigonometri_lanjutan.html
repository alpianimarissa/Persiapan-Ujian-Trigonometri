<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interaktif Trigonometri - Paket 2</title>
    <!-- MathJax for rendering LaTeX math formulas -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-card {
            transition: all 0.2s ease-in-out;
        }
        .option-card:hover:not(.disabled) {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-teal-700 text-white shadow-lg py-5 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Quiz Trigonometri Paket 2</h1>
                <p class="text-teal-200 text-sm">Perbandingan & Sudut Istimewa Trigonometri</p>
            </div>
            <div class="flex items-center gap-3 bg-teal-800 px-4 py-2 rounded-lg border border-teal-600">
                <span class="text-sm">Skor: <strong id="score-display" class="text-yellow-300 text-lg">0</strong> / 100</span>
                <button onclick="resetQuiz()" class="text-xs bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1.5 rounded transition shadow">Reset Progress</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Navigasi Soal -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-6 border border-slate-200">
            <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Navigasi Soal</h2>
            <div id="nav-buttons" class="flex flex-wrap gap-2">
                <!-- Tombol navigasi nomor soal -->
            </div>
        </div>

        <!-- Card Soal -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 relative">
            
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <span id="question-badge" class="bg-teal-100 text-teal-800 text-xs font-semibold px-3 py-1 rounded-full">
                    Soal Nomor 1
                </span>
                <span id="question-status" class="text-sm font-medium text-slate-500">
                    Belum dijawab
                </span>
            </div>

            <!-- Teks Soal -->
            <div id="question-text" class="text-lg font-medium text-slate-900 mb-6 leading-relaxed">
                <!-- Konten Soal -->
            </div>

            <!-- Kontainer Gambar/Diagram -->
            <div id="diagram-container" class="mb-6 flex justify-center hidden">
                <!-- Gambar SVG dirender di sini -->
            </div>

            <!-- Pilihan Jawaban -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Opsi Jawaban -->
            </div>

            <!-- Kotak Pembahasan -->
            <div id="explanation-box" class="hidden p-4 rounded-lg bg-teal-50 border-l-4 border-teal-500 my-6 shadow-inner">
                <h4 class="font-bold text-teal-900 mb-2 flex items-center gap-2">
                    <span>💡 Pembahasan & Penjelasan Lengkap:</span>
                </h4>
                <div id="explanation-text" class="text-slate-800 text-sm leading-relaxed space-y-2">
                    <!-- Teks Pembahasan -->
                </div>
            </div>

            <!-- Kontrol Navigasi (Sebelumnya/Selanjutnya) -->
            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                <button id="btn-prev" onclick="changeQuestion(-1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">
                    &larr; Sebelumnya
                </button>
                <button id="btn-next" onclick="changeQuestion(1)" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Selanjutnya &rarr;
                </button>
            </div>

        </div>

    </main>

    <script>
        const questionsData = [
            {
                id: 1,
                text: "Seorang pengamat berdiri sejauh $12\\sqrt{3}\\text{ m}$ dari dasar sebuah menara. Ia melihat puncak menara dengan sudut elevasi $30^\\circ$. Jika tinggi pengamat diabaikan, tinggi menara tersebut adalah ....",
                options: [
                    { letter: "A", text: "$12\\text{ m}$", correct: true },

                             "$$t = \\frac{12\\sqrt{3}}{\\sqrt{3}} = 12\\text{ m}$$",

                    <!-- Sudut Elevasi -->

                    <!-- Label Jarak & Tinggi -->
                    <text x="100" y="125" font-size="11" font-weight="bold" fill="#334155">12√3 m</text>
                    <text x="226" y="65" font-size="11" font-weight="bold" fill="#0f766e">t = ?</text>
                </svg>`
            },
            {
                id: 2,
                text: "Perhatikan tangga yang disandarkan pada dinding berikut. Panjang tangga adalah $6\\text{ m}$ dan membentuk sudut $60^\\circ$ terhadap lantai horizontal. Jarak ujung bawah tangga ke dinding adalah ....",
                options: [

                    { letter: "D", text: "$4\\text{ m}$", correct: false },

                ],

                             "$$\\cos 60^\\circ = \\frac{\\text{sisi samping}}{\\text{sisi miring}} = \\frac{x}{6}$$<br>" +
                             "$$\\frac{1}{2} = \\frac{x}{6} \\implies x = 3\\text{ m}$$",
                diagram: `<svg width="220" height="150" viewBox="0 0 220 150" class="bg-slate-50 rounded-lg p-2 border border-slate-200">
                    <!-- Dinding & Lantai -->
                    <line x1="180" y1="20" x2="180" y2="120" stroke="#334155" stroke-width="4"/>
                    <line x1="20" y1="120" x2="200" y2="120" stroke="#334155" stroke-width="3"/>
                    <!-- Tangga -->
                    <line x1="60" y1="120" x2="180" y2="30" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
                    <!-- Anak Tangga -->
                    <line x1="80" y1="105" x2="90" y2="112" stroke="#d97706" stroke-width="2"/>

            {

                text: "Diketahui titik $P(-4, 3)$ membentuk sudut $\\theta$ terhadap sumbu $X$ positif. Nilai dari $\\sec \\theta + \\tan \\theta = ....$",
                options: [
                    { letter: "A", text: "$2$", correct: false },
                    { letter: "B", text: "$1$", correct: false },
                    { letter: "C", text: "$-\\frac{1}{2}$", correct: true },
                    { letter: "D", text: "$-\\frac{7}{4}$", correct: false },
                    { letter: "E", text: "$\\frac{1}{2}$", correct: false }
                ],
                explanation: "Koordinat $x = -4$, $y = 3$. Panjang jari-jari $r = \\sqrt{(-4)^2 + 3^2} = \\sqrt{16+9} = 5$.<br>" +
                             "Maka:<br>" +
                             "- $\\sec \\theta = \\frac{r}{x} = \\frac{5}{-4} = -\\frac{5}{4}$<br>" +
                             "- $\\tan \\theta = \\frac{y}{x} = \\frac{3}{-4} = -\\frac{3}{4}$<br><br>" +

            },
            {
                id: 4,
                text: "Nilai dari $\\frac{\\sin 60^\\circ \\cdot \\cos 30^\\circ + \\cos 60^\\circ \\cdot \\sin 30^\\circ}{\\tan 45^\\circ} = ....$",
                options: [
                    { letter: "A", text: "$0$", correct: false },
                    { letter: "B", text: "$\\frac{1}{2}$", correct: false },
                    { letter: "C", text: "$1$", correct: true },
                    { letter: "D", text: "$\\sqrt{3}$", correct: false },
                    { letter: "E", text: "$\\frac{1}{2}\\sqrt{3}$", correct: false }
                ],
                explanation: "Substitusi nilai-nilai sudut istimewa:<br>" +
                             "- $\\sin 60^\\circ = \\frac{1}{2}\\sqrt{3}$, $\\cos 30^\\circ = \\frac{1}{2}\\sqrt{3}$<br>" +
                             "- $\\cos 60^\\circ = \\frac{1}{2}$, $\\sin 30^\\circ = \\frac{1}{2}$<br>" +
                             "- $\\tan 45^\\circ = 1$<br><br>" +

            {

                text: "Perhatikan jajaran genjang $ABCD$ berikut. Jika panjang $AB = 10\\text{ cm}$, $AD = 6\\text{ cm}$, dan sudut $\\angle DAB = 60^\\circ$, tinggi jajaran genjang terhadap alas $AB$ adalah ....",
                options: [
                    { letter: "A", text: "$3\\text{ cm}$", correct: false },
                    { letter: "B", text: "$3\\sqrt{2}\\text{ cm}$", correct: false },
                    { letter: "C", text: "$3\\sqrt{3}\\text{ cm}$", correct: true },
                    { letter: "D", text: "$5\\sqrt{3}\\text{ cm}$", correct: false },
                    { letter: "E", text: "$6\\text{ cm}$", correct: false }
                ],
                explanation: "Tinggi $t$ dapat dihitung dari segitiga siku-siku yang dibentuk oleh sisi $AD$ dan garis tinggi:<br>" +
                             "$$\\sin 60^\\circ = \\frac{t}{AD}$$<br>" +
                             "$$\\frac{1}{2}\\sqrt{3} = \\frac{t}{6} \\implies t = 6 \\times \\frac{1}{2}\\sqrt{3} = 3\\sqrt{3}\\text{ cm}$$",
                diagram: `<svg width="240" height="130" viewBox="0 0 240 130" class="bg-slate-50 rounded-lg p-2 border border-slate-200">
                    <polygon points="30,100 150,100 190,30 70,30" fill="none" stroke="#334155" stroke-width="2"/>
                    <line x1="70" y1="30" x2="70" y2="100" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3"/>
                    <!-- Sudut 60 deg -->
                    <path d="M 50,100 A 20 20 0 0 0 43,85" fill="none" stroke="#2563eb" stroke-width="1.8"/>
                    <text x="52" y="92" font-size="10" font-weight="bold" fill="#2563eb">60°</text>
                    <text x="20" y="105" font-size="11" font-weight="bold">A</text>

            },
            {
                id: 6,
                text: "Bentuk sederhana dari $(1 - \\cos^2 \\alpha)(1 + \\cot^2 \\alpha)$ adalah ....",
                options: [

                    { letter: "B", text: "$\\cos^2 \\alpha$", correct: false },
                    { letter: "C", text: "$\\tan^2 \\alpha$", correct: false },
                    { letter: "D", text: "$1$", correct: true },
                    { letter: "E", text: "$\\csc^2 \\alpha$", correct: false }

                    { letter: "B", text: "$60(\\sqrt{3} + 1)\\text{ m}$", correct: false },

                ],

                    <line x1="28" y1="30" x2="210" y2="110" stroke="#dc2626" stroke-width="1.5"/>
                    <text x="5" y="70" font-size="10" font-weight="bold">60m</text>
                </svg>`

            {

                options: [

                options: [
                    { letter: "A", text: "$4\\sqrt{2}\\text{ cm}$", correct: false },
                    { letter: "B", text: "$4\\sqrt{3}\\text{ cm}$", correct: true },
                    { letter: "C", text: "$8\\sqrt{3}\\text{ cm}$", correct: false },

        ];

        let currentQuestionIdx = 0;
        let userAnswers = {};

        function loadProgress() {
            const saved = localStorage.getItem('trig_quiz_pkg2_answers');
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch(e) {
                    userAnswers = {};
                }
            }
        }

        function saveProgress() {
            localStorage.setItem('trig_quiz_pkg2_answers', JSON.stringify(userAnswers));
            updateScoreDisplay();
        }

        function resetQuiz() {
            if (confirm("Apakah Anda yakin ingin mengulang quiz Paket 2 ini?")) {
                localStorage.removeItem('trig_quiz_pkg2_answers');
                userAnswers = {};
                currentQuestionIdx = 0;
                renderQuiz();
            }
        }

        function calculateScore() {
            let correctCount = 0;
            questionsData.forEach((q, idx) => {
                const selected = userAnswers[idx];
                if (selected) {
                    const opt = q.options.find(o => o.letter === selected);
                    if (opt && opt.correct) correctCount++;
                }
            });
            return Math.round((correctCount / questionsData.length) * 100);
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = calculateScore();
        }

        function renderNav() {
            const container = document.getElementById('nav-buttons');
            container.innerHTML = '';

            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-lg font-bold text-sm border transition flex items-center justify-center `;
                
                const isCurrent = idx === currentQuestionIdx;
                const answered = userAnswers[idx];

                if (isCurrent) {
                    btn.classList.add('ring-2', 'ring-teal-600', 'ring-offset-2');
                }

                if (answered) {
                    const isCorrect = q.options.find(o => o.letter === answered)?.correct;
                    if (isCorrect) {
                        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                    } else {
                        btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                    }
                } else {
                    btn.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300', 'hover:bg-slate-200');
                }

                btn.textContent = idx + 1;
                btn.onclick = () => {
                    currentQuestionIdx = idx;
                    renderQuiz();
                };
                container.appendChild(btn);
            });
        }

        function renderQuestion() {
            const q = questionsData[currentQuestionIdx];
            
            document.getElementById('question-badge').textContent = `Soal Nomor ${currentQuestionIdx + 1} dari ${questionsData.length}`;
            const statusEl = document.getElementById('question-status');
            
            if (userAnswers[currentQuestionIdx]) {
                statusEl.textContent = "Sudah dijawab";
                statusEl.className = "text-sm font-semibold text-teal-600";
            } else {
                statusEl.textContent = "Belum dijawab";
                statusEl.className = "text-sm font-medium text-slate-400";
            }

            document.getElementById('question-text').innerHTML = q.text;

            const diagContainer = document.getElementById('diagram-container');
            if (q.diagram) {
                diagContainer.innerHTML = q.diagram;
                diagContainer.classList.remove('hidden');
            } else {
                diagContainer.classList.add('hidden');
                diagContainer.innerHTML = '';
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const selectedAnswer = userAnswers[currentQuestionIdx];

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = `option-card p-4 rounded-xl border-2 cursor-pointer flex items-center justify-between transition `;
                
                if (selectedAnswer) {
                    btn.classList.add('disabled');
                    if (opt.letter === selectedAnswer) {
                        if (opt.correct) {
                            btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                            btn.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center">${opt.letter}</span>
                                    <span>${opt.text}</span>
                                </div>
                                <span class="text-emerald-600 font-bold text-sm">✓ Benar</span>
                            `;
                        } else {
                            btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                            btn.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center">${opt.letter}</span>
                                    <span>${opt.text}</span>
                                </div>
                                <span class="text-rose-600 font-bold text-sm">✗ Salah</span>
                            `;
                        }
                    } else if (opt.correct) {
                        btn.classList.add('border-emerald-400', 'bg-emerald-50/50', 'text-slate-800');
                        btn.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center">${opt.letter}</span>
                                <span>${opt.text}</span>
                            </div>
                            <span class="text-emerald-600 text-xs font-semibold">(Kunci Jawaban)</span>
                        `;
                    } else {
                        btn.classList.add('border-slate-200', 'opacity-50', 'cursor-not-allowed');
                        btn.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold flex items-center justify-center">${opt.letter}</span>
                                <span>${opt.text}</span>
                            </div>
                        `;
                    }
                } else {
                    btn.classList.add('border-slate-200', 'hover:border-teal-400', 'hover:bg-teal-50/30');
                    btn.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold flex items-center justify-center">${opt.letter}</span>
                            <span>${opt.text}</span>
                        </div>
                    `;
                    btn.onclick = () => selectOption(opt.letter);
                }

                optionsContainer.appendChild(btn);
            });

            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');
            if (selectedAnswer) {
                expText.innerHTML = q.explanation;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            document.getElementById('btn-prev').disabled = currentQuestionIdx === 0;
            document.getElementById('btn-next').disabled = currentQuestionIdx === questionsData.length - 1;

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        function selectOption(letter) {
            userAnswers[currentQuestionIdx] = letter;
            saveProgress();
            renderQuiz();
        }

        function changeQuestion(dir) {
            const newIdx = currentQuestionIdx + dir;
            if (newIdx >= 0 && newIdx < questionsData.length) {
                currentQuestionIdx = newIdx;
                renderQuiz();
            }
        }

        function renderQuiz() {
            renderNav();
            renderQuestion();
            updateScoreDisplay();
        }

        window.onload = () => {
            loadProgress();
            renderQuiz();
        };
    </script>
</body>
</html>
