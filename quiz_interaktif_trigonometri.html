            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <span id="question-badge" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-3 py-1 rounded-full">

                </span>
                <span id="question-status" class="text-sm font-medium text-slate-500">

            </div>

                </button>

        </div>

    </main>

            {

                diagram: `<svg width="220" height="130" viewBox="0 0 220 130">
                    <polygon points="20,110 200,110 20,20" fill="none" stroke="#334155" stroke-width="2"/>
                    <line x1="110" y1="110" x2="20" y2="20" stroke="#334155" stroke-width="1.5"/>
                    <rect x="20" y="95" width="15" height="15" fill="none" stroke="#334155" stroke-width="1.5"/>
                    <text x="10" y="20" font-size="12" font-weight="bold">A</text>
                    <text x="10" y="125" font-size="12" font-weight="bold">B</text>
                    <text x="110" y="125" font-size="12" font-weight="bold">M</text>
                    <text x="205" y="125" font-size="12" font-weight="bold">C</text>
                    <text x="65" y="105" font-size="10">45°</text>
                    <text x="150" y="105" font-size="10">30°</text>
                </svg>`
            }
        ];

        let currentQuestionIdx = 0;
        let userAnswers = {}; // Format: { questionIdx: selectedLetter }

        // Memuat progress dari LocalStorage
        function loadProgress() {
            const saved = localStorage.getItem('trig_quiz_answers');
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch(e) {
                    userAnswers = {};
                }
            }
        }

        // Menyimpan progress ke LocalStorage
        function saveProgress() {
            localStorage.setItem('trig_quiz_answers', JSON.stringify(userAnswers));
            updateScoreDisplay();
        }

        // Reset Quiz
        function resetQuiz() {
            if (confirm("Apakah Anda yakin ingin mengulang quiz dan menghapus semua jawaban yang tersimpan?")) {
                localStorage.removeItem('trig_quiz_answers');
                userAnswers = {};
                currentQuestionIdx = 0;
                renderQuiz();
            }
        }

        // Hitung Skor
        function calculateScore() {
            let correctCount = 0;
            questionsData.forEach((q, idx) => {
                const selected = userAnswers[idx];
                if (selected) {
                    const opt = q.options.find(o => o.letter === selected);
                    if (opt && opt.correct) correctCount++;
                }
            });
            return Math.round((correctCount / questionsData.length) * 100);
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = calculateScore();
        }

        // Render Tombol Navigasi Nomor Soal
        function renderNav() {
            const container = document.getElementById('nav-buttons');
            container.innerHTML = '';

            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-lg font-bold text-sm border transition flex items-center justify-center `;
                
                const isCurrent = idx === currentQuestionIdx;
                const answered = userAnswers[idx];

                if (isCurrent) {
                    btn.classList.add('ring-2', 'ring-indigo-600', 'ring-offset-2');
                }

                if (answered) {
                    const isCorrect = q.options.find(o => o.letter === answered)?.correct;
                    if (isCorrect) {
                        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                    } else {
                        btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                    }
                } else {
                    btn.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300', 'hover:bg-slate-200');
                }

                btn.textContent = idx + 1;
                btn.onclick = () => {
                    currentQuestionIdx = idx;
                    renderQuiz();
                };
                container.appendChild(btn);
            });
        }

        // Render Tampilan Soal Aktif
        function renderQuestion() {
            const q = questionsData[currentQuestionIdx];
            
            // Badge & status
            document.getElementById('question-badge').textContent = `Soal Nomor ${currentQuestionIdx + 1} dari ${questionsData.length}`;
            const statusEl = document.getElementById('question-status');
            
            if (userAnswers[currentQuestionIdx]) {
                statusEl.textContent = "Sudah dijawab";
                statusEl.className = "text-sm font-semibold text-emerald-600";
            } else {
                statusEl.textContent = "Belum dijawab";
                statusEl.className = "text-sm font-medium text-slate-400";
            }

            // Teks Soal
            document.getElementById('question-text').innerHTML = q.text;

            // Gambar / Diagram SVG
            const diagContainer = document.getElementById('diagram-container');
            if (q.diagram) {
                diagContainer.innerHTML = q.diagram;
                diagContainer.classList.remove('hidden');
            } else {
                diagContainer.classList.add('hidden');
                diagContainer.innerHTML = '';
            }

            // Opsi Jawaban
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const selectedAnswer = userAnswers[currentQuestionIdx];

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = `option-card p-4 rounded-xl border-2 cursor-pointer flex items-center justify-between transition `;
                
                if (selectedAnswer) {
                    btn.classList.add('disabled');
                    // Tampilan ketika sudah dijawab
                    if (opt.letter === selectedAnswer) {
                        if (opt.correct) {
                            btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                            btn.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center">${opt.letter}</span>
                                    <span>${opt.text}</span>
                                </div>
                                <span class="text-emerald-600 font-bold text-sm">✓ Benar</span>
                            `;
                        } else {
                            btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                            btn.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <span class="w-8 h-8 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center">${opt.letter}</span>
                                    <span>${opt.text}</span>
                                </div>
                                <span class="text-rose-600 font-bold text-sm">✗ Salah</span>
                            `;
                        }
                    } else if (opt.correct) {
                        btn.classList.add('border-emerald-400', 'bg-emerald-50/50', 'text-slate-800');
                        btn.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center">${opt.letter}</span>
                                <span>${opt.text}</span>
                            </div>
                            <span class="text-emerald-600 text-xs font-semibold">(Kunci Jawaban)</span>
                        `;
                    } else {
                        btn.classList.add('border-slate-200', 'opacity-50', 'cursor-not-allowed');
                        btn.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold flex items-center justify-center">${opt.letter}</span>
                                <span>${opt.text}</span>
                            </div>
                        `;
                    }
                } else {
                    // Tampilan ketika belum dijawab
                    btn.classList.add('border-slate-200', 'hover:border-indigo-400', 'hover:bg-indigo-50/30');
                    btn.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold flex items-center justify-center">${opt.letter}</span>
                            <span>${opt.text}</span>
                        </div>
                    `;
                    btn.onclick = () => selectOption(opt.letter);
                }

                optionsContainer.appendChild(btn);
            });

            // Pembahasan
            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');
            if (selectedAnswer) {
                expText.innerHTML = q.explanation;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Tombol Navigasi Prev/Next
            document.getElementById('btn-prev').disabled = currentQuestionIdx === 0;
            document.getElementById('btn-next').disabled = currentQuestionIdx === questionsData.length - 1;

            // Render Ulang Rumus Matematika dengan MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        function selectOption(letter) {
            userAnswers[currentQuestionIdx] = letter;
            saveProgress();
            renderQuiz();
        }

        function changeQuestion(dir) {
            const newIdx = currentQuestionIdx + dir;
            if (newIdx >= 0 && newIdx < questionsData.length) {
                currentQuestionIdx = newIdx;
                renderQuiz();
            }
        }

        function renderQuiz() {
            renderNav();
            renderQuestion();
            updateScoreDisplay();
        }

        // Inisialisasi Aplikasi ketika halaman selesai dimuat
        window.onload = () => {
            loadProgress();
            renderQuiz();
        };
    </script>
</body>
</html>
